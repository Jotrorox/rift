name: Nightly

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 2 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: Release cadence
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.schedule == '47 2 * * 1' && 'weekly' || inputs.channel || 'daily' }}
  cancel-in-progress: false

jobs:
  changes:
    name: Find changes since the previous nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.notes.outputs.changed }}
      tag: ${{ steps.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event.schedule == '47 2 * * 1' && 'weekly' || inputs.channel || 'daily' }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/nightly.py --channel "$CHANNEL" \
            --repository "$GITHUB_REPOSITORY" --releases "$RUNNER_TEMP/releases.json" \
            --notes "$RUNNER_TEMP/CHANGELOG.md" --output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.notes.outputs.changed == 'true'
        with:
          name: nightly-changelog
          path: ${{ runner.temp }}/CHANGELOG.md
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested nightly artifacts and changelog
    needs: [changes, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-changelog
          path: dist
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.changes.outputs.tag }}
        working-directory: dist
        run: |
          sha256sum --check rift-linux-x86_64.tar.gz.sha256 \
            rift-macos-aarch64.tar.gz.sha256 rift-windows-x86_64.zip.sha256
          cat ./*.sha256 > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS CHANGELOG.md \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$RELEASE_TAG" --notes-file CHANGELOG.md
