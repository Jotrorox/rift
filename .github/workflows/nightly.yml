name: Nightly

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 2 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: Release cadence
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.schedule == '47 2 * * 1' && 'weekly' || inputs.channel || 'daily' }}
  cancel-in-progress: false

jobs:
  changes:
    name: Find changes since the previous nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      tag: ${{ steps.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare nightly release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event.schedule == '47 2 * * 1' && 'weekly' || inputs.channel || 'daily' }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/nightly.py --channel "$CHANNEL" \
            --releases "$RUNNER_TEMP/releases.json" --output "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested nightly executables
    needs: [changes, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.changes.outputs.tag }}
        working-directory: dist
        run: |
          gh release create "$RELEASE_TAG" \
            rift-linux-x86_64 rift-macos-aarch64 rift-windows-x86_64.exe \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$RELEASE_TAG" --notes "Built from $GITHUB_SHA."
