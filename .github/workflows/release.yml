name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v0.1.0 releases Cargo.toml's 0.1.0; v0.1.0-rc.1 is a release candidate
      # for it: the same pipeline, published as a prerelease.
      - name: Require tag to match Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch('v' + re.escape(version) + r'(-rc\.[1-9][0-9]*)?', tag), (
              f'Tag {tag} must be v{version} or v{version}-rc.N to match Cargo.toml')
          PY
      # A stable release's notes are its CHANGELOG.md entry, which must be dated;
      # a release candidate gets generated notes.
      - name: Take the release notes from CHANGELOG.md
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          with open('CHANGELOG.md', encoding='utf-8') as source:
              changelog = source.read()
          heading = re.search(
              r'^## \[' + re.escape(version) + r'\] - (\d{4}-\d{2}-\d{2})$', changelog, re.M)
          assert heading, f'CHANGELOG.md needs a dated "## [{version}] - YYYY-MM-DD" entry'
          rest = changelog[heading.end():]
          end = re.search(r'^(## |\[[^\]]+\]: )', rest, re.M)
          notes = (rest[:end.start()] if end else rest).strip()
          assert notes, f'The CHANGELOG.md entry for {version} is empty'
          assert '```' not in notes, 'Unwrapping below would mangle a code block'
          # Release pages keep single line breaks: join each paragraph and bullet.
          notes = re.sub(r'(?<!\n)\n(?!\n|- |#)[ ]*', ' ', notes)
          repository = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          notes += (f'\n\nInstall and verify: [docs/install.md]({repository}/blob/v{version}/docs/install.md).'
                    f' Upgrading: [docs/upgrading.md]({repository}/blob/v{version}/docs/upgrading.md).\n')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'notes.md'), 'w', encoding='utf-8') as out:
              out.write(notes)
          PY
      - if: ${{ !contains(github.ref_name, '-rc.') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not release-*: the asset downloads below must not pick it up.
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  java:
    name: Build Java artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Write the static Maven layout and the plugin jar
        working-directory: java
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon -Pversion="$version" build publishAllPublicationsToReleaseRepository
          mkdir -p "$RUNNER_TEMP/java"
          (cd build/release-repo && zip -qr "$RUNNER_TEMP/java/rift-maven-$version.zip" .)
          cp "paper/build/libs/RiftPerms-$version.jar" "$RUNNER_TEMP/java/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-java
          path: ${{ runner.temp }}/java/*
          if-no-files-found: error

  publish:
    name: Publish tested release assets
    needs: [verify, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Sign and store build provenance attestations for every asset.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - if: ${{ !contains(github.ref_name, '-rc.') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      - name: Record asset checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          # sha256sum fails here if any expected asset is missing.
          sha256sum \
            rift-linux-x86_64.tar.gz rift-linux-aarch64.tar.gz \
            rift-linux-x86_64-musl.tar.gz rift-linux-aarch64-musl.tar.gz \
            rift-macos-aarch64.tar.gz rift-windows-x86_64.zip \
            rift-linux-x86_64 rift-linux-aarch64 \
            rift-linux-x86_64-musl rift-linux-aarch64-musl \
            rift-macos-aarch64 rift-windows-x86_64.exe \
            "RiftPerms-$version.jar" "rift-maven-$version.zip" > SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance for every asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish archives, executables, Java artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          mapfile -t assets < <(cut -d ' ' -f 3- SHA256SUMS)
          # A release candidate never becomes the "latest" release.
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            flags=(--generate-notes --prerelease --latest=false)
          else
            flags=(--notes-file "$RUNNER_TEMP/notes/notes.md" --latest)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" "${flags[@]}"

  image:
    name: Build container image (${{ matrix.arch }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners: the image build runs the executable.
          - os: ubuntu-24.04
            arch: amd64
            executable: rift-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            executable: rift-linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build and push the image of the released executable
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          docker build --file examples/Dockerfile \
            --build-arg RIFT_BINARY="$EXECUTABLE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$version-$ARCH" dist
          docker push "$image:$version-$ARCH"

  image-index:
    name: Publish the multi-platform container image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Sign and store build provenance for the image.
      id-token: write
      attestations: write
    steps:
      - name: Join the per-platform images under the release's tags
        id: index
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          tags=(--tag "$image:$version")
          # A release candidate never becomes "latest".
          if [[ "$RELEASE_TAG" != *-rc.* ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$version-amd64" "$image:$version-arm64"
          digest="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]]
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "\`$image:$version\` is \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance for the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  packages:
    name: Mirror Java artifacts to GitHub Packages
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Publish to GitHub Packages
        working-directory: java
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ github.token }}
        run: ./gradlew --no-daemon -Pversion="${RELEASE_TAG#v}" publishAllPublicationsToGitHubPackagesRepository

  pages:
    name: Rebuild the site with the new Maven artifacts
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The Pages build assembles maven/ from every release's rift-maven-*.zip, so a
      # documentation-only deployment never drops published versions.
      - name: Dispatch the documentation site build on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH"
