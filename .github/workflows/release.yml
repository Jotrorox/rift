name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require tag to match Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested release artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum --check rift-linux-x86_64.tar.gz.sha256 \
            rift-macos-aarch64.tar.gz.sha256 rift-windows-x86_64.zip.sha256
          cat ./*.sha256 > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
