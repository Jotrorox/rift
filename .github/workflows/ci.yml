name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  quality:
    name: Formatting, lint and harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          key: ubuntu-24.04
          cache-bin: false
          # Keep PR/tag caches from crowding out reusable default-branch caches.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint without WebAssembly support
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test bundled frontend without npm dependencies
        run: node src/web_assets/tests.js
      - name: Restore actionlint download
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint.tar.gz
          key: v1-actionlint-${{ runner.os }}-${{ runner.arch }}-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: Download actionlint on cache miss
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
      - name: Validate GitHub Actions workflows
        run: |
          # Verify cache hits too, before executing the downloaded tool.
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Save verified actionlint download
        if: >-
          steps.actionlint-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint.tar.gz
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

  plugin-sdk-rust:
    name: Rust plugin SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and the WebAssembly target
        run: |
          rustup show
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          key: plugin-sdk-rust
          cache-bin: false
          # Both are standalone workspaces outside the proxy's build.
          workspaces: |
            sdk/rust
            examples/plugins/hello-rs
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Check the SDK ships the repository's WIT unchanged
        run: diff -r wit sdk/rust/wit
      - name: Check formatting
        run: |
          cargo fmt --manifest-path sdk/rust/Cargo.toml --check
          cargo fmt --manifest-path examples/plugins/hello-rs/Cargo.toml --check
      - name: Lint for wasm32-wasip2
        run: |
          cargo clippy --locked --manifest-path sdk/rust/Cargo.toml --target wasm32-wasip2 -- -D warnings
          cargo clippy --locked --manifest-path examples/plugins/hello-rs/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - name: Test SDK helpers and documentation on the host
        run: cargo test --locked --manifest-path sdk/rust/Cargo.toml
      - name: Build hello-rs as a component
        working-directory: examples/plugins/hello-rs
        run: cargo build --locked --release --target wasm32-wasip2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-rs-wasm
          path: examples/plugins/hello-rs/target/wasm32-wasip2/release/hello_rs.wasm
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: '0.22.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - name: Restore cargo-audit executable
        id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Tool installation is independent of Rift's dependency lockfile.
          path: ${{ runner.temp }}/cargo-audit
          key: v1-cargo-audit-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-audit on cache miss
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --root "$RUNNER_TEMP/cargo-audit"
      - name: Save cargo-audit executable
        if: >-
          steps.audit-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}
      - name: Audit against the current advisory database
        # Cache the tool, never the advisory database or audit result.
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --deny warnings'

  pumpkin-adapter:
    name: Pumpkin permissions adapter
    # Pumpkin is a large git dependency, so the adapter (its own workspace in
    # adapters/pumpkin) builds on the weekly and nightly schedules and on
    # demand, not on every pull request; ci-ready does not wait for it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: adapters/pumpkin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          key: pumpkin-adapter
          workspaces: adapters/pumpkin
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  plugin-sdk-c:
    name: C and Go plugin SDKs (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WASI_SDK_VERSION: '27.0'
      WASI_SDK_SHA256: b7d4d944c88503e4f21d84af07ac293e3440b1b6210bfd7fe78e0afd92c23bc2
      WIT_BINDGEN_VERSION: '0.63.0'
      WIT_BINDGEN_SHA256: bf4efe883ab70d34a4740253911dda20caf895d58a003af58369506b04684cbe
      WASM_TOOLS_VERSION: '1.263.0'
      WASM_TOOLS_SHA256: 21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore toolchain downloads
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: v1-plugin-sdk-c-${{ runner.os }}-${{ runner.arch }}-${{ env.WASI_SDK_SHA256 }}-${{ env.WIT_BINDGEN_SHA256 }}-${{ env.WASM_TOOLS_SHA256 }}
      - name: Download toolchains on cache miss
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          cd "$RUNNER_TEMP/downloads"
          fetch() { curl --fail --silent --show-error --location --retry 3 "$1" -o "$2"; }
          fetch "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz" wasi-sdk.tar.gz
          fetch "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz" wit-bindgen.tar.gz
          fetch "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" wasm-tools.tar.gz
      - name: Verify and install toolchains
        run: |
          # Verify cache hits too, before executing the downloaded tools.
          cd "$RUNNER_TEMP/downloads"
          sha256sum --check <<EOF
          $WASI_SDK_SHA256  wasi-sdk.tar.gz
          $WIT_BINDGEN_SHA256  wit-bindgen.tar.gz
          $WASM_TOOLS_SHA256  wasm-tools.tar.gz
          EOF
          mkdir -p "$RUNNER_TEMP/tools/bin" "$RUNNER_TEMP/tools/wasi-sdk"
          tar xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP/tools/wasi-sdk" --strip-components=1
          tar xzf wit-bindgen.tar.gz -C "$RUNNER_TEMP/tools/bin" --strip-components=1 --wildcards '*/wit-bindgen'
          tar xzf wasm-tools.tar.gz -C "$RUNNER_TEMP/tools/bin" --strip-components=1 --wildcards '*/wasm-tools'
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/tools/wasi-sdk" >> "$GITHUB_ENV"
      - name: Check the committed C bindings match wit/
        run: sdk/c/regenerate.sh --check
      - name: Build hello-c
        run: make -C examples/plugins/hello-c
      - name: Verify the hello-c component
        run: sdk/check-component.sh examples/plugins/hello-c/hello_c.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-c-wasm
          path: examples/plugins/hello-c/hello_c.wasm
          if-no-files-found: error
          retention-days: 14
      - name: Save verified toolchain downloads
        if: >-
          steps.tools-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

  plugin-sdk-go:
    name: C and Go plugin SDKs (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # TinyGo 0.43 and 0.44 leak host-allocated memory; see sdk/go/README.md.
      TINYGO_VERSION: '0.42.0'
      TINYGO_SHA256: b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438
      WASM_TOOLS_VERSION: '1.263.0'
      WASM_TOOLS_SHA256: 21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Restore toolchain downloads
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: v1-plugin-sdk-go-${{ runner.os }}-${{ runner.arch }}-${{ env.TINYGO_SHA256 }}-${{ env.WASM_TOOLS_SHA256 }}
      - name: Download toolchains on cache miss
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          cd "$RUNNER_TEMP/downloads"
          fetch() { curl --fail --silent --show-error --location --retry 3 "$1" -o "$2"; }
          fetch "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz" tinygo.tar.gz
          fetch "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" wasm-tools.tar.gz
      - name: Verify and install toolchains
        run: |
          # Verify cache hits too, before executing the downloaded tools.
          cd "$RUNNER_TEMP/downloads"
          sha256sum --check <<EOF
          $TINYGO_SHA256  tinygo.tar.gz
          $WASM_TOOLS_SHA256  wasm-tools.tar.gz
          EOF
          mkdir -p "$RUNNER_TEMP/tools/bin" "$RUNNER_TEMP/tools/tinygo"
          tar xzf tinygo.tar.gz -C "$RUNNER_TEMP/tools/tinygo" --strip-components=1
          tar xzf wasm-tools.tar.gz -C "$RUNNER_TEMP/tools/bin" --strip-components=1 --wildcards '*/wasm-tools'
          # The Linux TinyGo release bundles wasm-opt next to tinygo.
          {
            echo "$RUNNER_TEMP/tools/bin"
            echo "$RUNNER_TEMP/tools/tinygo/bin"
          } >> "$GITHUB_PATH"
      - name: Check formatting, vet and test the rift package
        working-directory: sdk/go
        run: |
          unformatted="$(gofmt -l rift ../../examples/plugins/hello-go)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed: $unformatted" >&2
            exit 1
          fi
          go vet ./rift/
          go test ./rift/
      - name: Check the committed Go bindings match wit/
        run: sdk/go/regenerate.sh --check
      - name: Build hello-go
        run: |
          tinygo version
          make -C examples/plugins/hello-go
      - name: Verify the hello-go component
        run: sdk/check-component.sh examples/plugins/hello-go/hello_go.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-go-wasm
          path: examples/plugins/hello-go/hello_go.wasm
          if-no-files-found: error
          retention-days: 14
      - name: Save verified toolchain downloads
        if: >-
          steps.tools-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

  plugin-examples-wasm:
    name: C and Go examples on the WebAssembly engine
    needs: [plugin-sdk-c, plugin-sdk-go]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and the WebAssembly target
        run: |
          rustup show
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          shared-key: regression-ubuntu-24.04
          cache-bin: false
          # Only regression saves the shared cache.
          save-if: false
      - name: Download this run's hello-c component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hello-c-wasm
          path: examples/plugins/hello-c
      - name: Download this run's hello-go component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hello-go-wasm
          path: examples/plugins/hello-go
      - name: Run the WebAssembly conformance tests with every hello example
        # The tests pick up hello_c.wasm and hello_go.wasm in their example folders.
        run: |
          test -f examples/plugins/hello-c/hello_c.wasm
          test -f examples/plugins/hello-go/hello_go.wasm
          cargo test --locked --lib plugins::wasm -- --test-threads=1

  regression:
    name: Regression (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Debug and release builds of the wasmtime plugin engine. Pull requests
    # never save the dependency cache, so they compile it cold every time.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: rift-linux-x86_64
            archive: rift-linux-x86_64.tar.gz
          - os: macos-15
            platform: macos-aarch64
            executable: rift-macos-aarch64
            archive: rift-macos-aarch64.tar.gz
          - os: windows-2022
            platform: windows-x86_64
            executable: rift-windows-x86_64.exe
            archive: rift-windows-x86_64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and the WebAssembly target
        # The WebAssembly conformance tests build their guest components.
        run: |
          rustup show
          rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          # This job owns the complete debug + release dependency cache.
          shared-key: regression-${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Concurrent test cases can consume the 50 ms Lua callback budget on
      # shared runners before workers run. Each concurrency test still
      # exercises its own parallel clients/workers.
      - run: cargo test --locked --all-targets -- --test-threads=1
      - run: cargo test --locked --all-targets --release -- --test-threads=1
      - run: cargo build --locked --release
      - name: Verify protocol and zlib interoperability
        run: python tests/protocol_wire.py --binary target/release/rift
      - name: Verify server switching and recovery
        run: python tests/network_wire.py --binary target/release/rift
      - name: Verify managed server lifecycle
        run: python tests/managed_wire.py --binary target/release/rift
      - name: Verify dynamic service groups
        run: python tests/services_wire.py --binary target/release/rift
      - name: Verify automatic scaling and bounded recovery
        run: python tests/scaling_wire.py --binary target/release/rift
      - name: Verify templates and instance storage
        run: python tests/provisioning_wire.py --binary target/release/rift
      - name: Verify SQLite instance recovery
        run: python tests/instance_persistence_wire.py --binary target/release/rift
      - name: Verify BungeeCord plugin-message compatibility
        run: python tests/bungeecord_wire.py --binary target/release/rift
      - name: Stage, archive and smoke-test executable
        run: python scripts/package.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/${{ matrix.executable }}
            dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  java:
    name: Java libraries and RiftPerms
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Unit tests, the shared fixture corpus, Javadoc and the shaded plugin jar.
      - run: ./gradlew build --no-daemon
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          shared-key: regression-ubuntu-24.04
          cache-bin: false
          save-if: false
      - name: Build the proxy for interoperability tests
        working-directory: .
        run: cargo build --locked --bin rift
      - name: Interoperate with the real proxy over QUIC
        run: ./gradlew integrationTest --no-daemon
      - name: Preserve test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: java/*/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  test-session-server:
    name: Local session server feature
    # The only build with `test-session-server`. Release, nightly and every
    # other job build the default features, which leave it out.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          shared-key: regression-ubuntu-24.04
          cache-bin: false
          # Only regression saves the shared cache.
          save-if: false
      - run: cargo clippy --locked --all-targets --features test-session-server -- -D warnings
      - name: Test authentication with the override compiled in
        run: cargo test --locked --features test-session-server --lib -- auth:: session:: --test-threads=1
      - name: Log a bot in through a local session server
        run: cargo test --locked --features test-session-server --test session_server

  build-linux:
    name: Build shared Linux test executable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compatibility: ${{ steps.compatibility.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-rust
          shared-key: regression-ubuntu-24.04
          cache-bin: false
          # Only regression saves, so a release-only build cannot win the race
          # and leave the shared immutable cache without debug dependencies.
          save-if: false
      - name: Read compatibility matrix from pinned fixtures
        id: compatibility
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          with open('tests/servers.json') as source:
              fixtures = json.load(source)
          print('servers=' + json.dumps([dict(server=name, java=fixture['java']) for name, fixture in fixtures.items() if fixture.get('switchable')]))
          PYTHON
      - run: cargo build --locked --release
      - name: Archive executable with its Unix permissions
        run: tar -czf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release rift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}/rift-linux.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  minecraft:
    name: Minecraft (${{ matrix.server }}, compression ${{ matrix.compression }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [vanilla, paper, pumpkin]
        compression: [enabled, disabled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.server != 'pumpkin'
        with:
          distribution: temurin
          java-version: '21'
      - name: Read server download identity
        id: fixture
        env:
          SERVER: ${{ matrix.server }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open('tests/servers.json') as source:
              fixture = json.load(source)[os.environ['SERVER']]
          for field in ('filename', 'algorithm', 'checksum'):
              print(f'{field}={fixture[field]}')
          PY
      - name: Restore verified server download (never worlds or logs)
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/minecraft/downloads/${{ steps.fixture.outputs.filename }}
          # Compression modes share a download; unrelated fixture updates do
          # not invalidate it. The harness verifies its checksum on every use.
          key: v2-servers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.server }}-${{ steps.fixture.outputs.algorithm }}-${{ steps.fixture.outputs.checksum }}
      - name: Test real server through Rift
        run: >-
          python tests/minecraft.py --accept-eula
          --binary target/release/rift
          --server ${{ matrix.server }}
          --compression ${{ matrix.compression }}
          --report target/minecraft/report.json
      - name: Verify managed Paper cold start and idle shutdown
        if: matrix.server == 'paper' && matrix.compression == 'enabled'
        run: >-
          python tests/managed_minecraft.py --accept-eula
          --binary target/release/rift --server paper
      - name: Verify persistent and disposable Paper template instances
        if: matrix.server == 'paper' && matrix.compression == 'enabled'
        run: |
          python tests/managed_minecraft.py --accept-eula --binary target/release/rift --server paper --template-storage persistent
          python tests/managed_minecraft.py --accept-eula --binary target/release/rift --server paper --template-storage disposable
      - name: Save verified server download
        if: >-
          steps.server-cache.outputs.cache-hit != 'true' && matrix.compression == 'enabled' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/minecraft/downloads/${{ steps.fixture.outputs.filename }}
          key: ${{ steps.server-cache.outputs.cache-primary-key }}
      - name: Preserve reports and server/proxy logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-${{ matrix.server }}-${{ matrix.compression }}
          path: |
            target/minecraft/report.json
            target/minecraft/runs/*/result.json
            target/minecraft/runs/**/*.log
            target/minecraft/runs/**/resources.jsonl
            target/minecraft/runs/**/rift.lua
            target/minecraft/runs/**/crash-reports/**
          if-no-files-found: warn
          retention-days: 14

  paper-auth-preflight:
    name: Authenticated Paper preflight (${{ matrix.stack }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [baseline, essentials, protocol]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real Paper plugins and authentication rejection paths
        # This intentionally cannot claim a signed-in client acceptance pass.
        run: >-
          python tests/manual_online.py --accept-eula --preflight
          --binary target/release/rift --plugin-stack ${{ matrix.stack }}
      - name: Test observer callbacks with an unsigned client
        run: python tests/online_probe_wire.py --accept-eula --plugin-stack ${{ matrix.stack }}
      - name: Preserve preflight evidence (no forwarding-secret configuration files)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-auth-preflight-${{ matrix.stack }}
          path: |
            target/minecraft/runs/manual-online-*/result.json
            target/minecraft/runs/manual-online-*/proxy.log
            target/minecraft/runs/manual-online-*/primary/*.log
            target/minecraft/runs/manual-online-*/lobby/*.log
            target/minecraft/runs/manual-online-*/**/plugins/RiftOnlineProbe/profiles.jsonl
            target/minecraft/runs/online-probe-*/result.json
            target/minecraft/runs/online-probe-*/server.log
            target/minecraft/runs/online-probe-*/plugins/RiftOnlineProbe/profiles.jsonl
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Compatibility (${{ matrix.server }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-linux.outputs.compatibility) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Read server download identity
        id: fixture
        env:
          SERVER: ${{ matrix.server }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open('tests/servers.json') as source:
              fixture = json.load(source)[os.environ['SERVER']]
          for field in ('filename', 'algorithm', 'checksum'):
              print(f'{field}={fixture[field]}')
          PY
      - name: Restore verified server download (never worlds or logs)
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/minecraft/downloads/${{ steps.fixture.outputs.filename }}
          # Only verified downloads are cached; worlds are always fresh.
          key: v2-servers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.server }}-${{ steps.fixture.outputs.algorithm }}-${{ steps.fixture.outputs.checksum }}
      - name: Test login, switching, ban rollback and crash recovery
        run: >-
          python tests/network_minecraft.py --accept-eula
          --binary target/release/rift --server ${{ matrix.server }}
      - name: Save verified server download
        if: >-
          steps.server-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/minecraft/downloads/${{ steps.fixture.outputs.filename }}
          key: ${{ steps.server-cache.outputs.cache-primary-key }}
      - name: Preserve reports and server/proxy logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.server }}
          path: |
            target/minecraft/runs/**/*.log
            target/minecraft/runs/**/network.lua
            target/minecraft/runs/**/crash-reports/**
          if-no-files-found: warn
          retention-days: 14

  translation:
    name: Protocol translation (${{ matrix.mode }})
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [upgrade, downgrade, network]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Read server download identities
        id: fixtures
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('tests/servers.json') as source:
              fixtures = json.load(source)
          names = ('vanilla-1.21.6', 'vanilla-1.21.8')
          print('checksums=' + '-'.join(fixtures[name]['checksum'][:16] for name in names))
          PY
      - name: Restore verified server downloads (never worlds or logs)
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/minecraft/downloads/vanilla-1.21.6.jar
            target/minecraft/downloads/vanilla-1.21.8.jar
          key: v1-translation-servers-${{ runner.os }}-${{ runner.arch }}-${{ steps.fixtures.outputs.checksums }}
      - name: Check generated translation data against Mojang's reports
        if: matrix.mode == 'upgrade'
        run: python scripts/translation_data.py --check
      - name: Compare translated and direct sessions on a real server
        run: >-
          python tests/translation_minecraft.py --accept-eula
          --binary target/release/rift --mode ${{ matrix.mode }}
      - name: Save verified server downloads
        if: >-
          steps.server-cache.outputs.cache-hit != 'true' && matrix.mode == 'upgrade' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/minecraft/downloads/vanilla-1.21.6.jar
            target/minecraft/downloads/vanilla-1.21.8.jar
          key: ${{ steps.server-cache.outputs.cache-primary-key }}
      - name: Preserve server and proxy logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translation-${{ matrix.mode }}
          path: |
            target/minecraft/runs/translation-*/**/*.log
            target/minecraft/runs/translation-*/rift.lua
            target/minecraft/runs/translation-*/**/crash-reports/**
          if-no-files-found: warn
          retention-days: 14

  translation-matrix:
    name: Translation across versions (${{ matrix.server }})
    # Started by hand until it has proven itself on these runners; the cells
    # pass on a developer machine (docs/translation.md).
    if: github.event_name == 'workflow_dispatch'
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: vanilla-1.12.2
            clients: 1.16.5,26.3
          - server: vanilla-1.16.5
            clients: 1.12.2,1.20.1
          - server: vanilla-1.20.1
            clients: 1.12.2,1.21.4
          - server: vanilla-1.21.4
            clients: 1.16.5,26.3
          - server: vanilla-26.3
            clients: 1.12.2,1.20.1,1.21.4
    env:
      RIFT_VIA_CACHE: ${{ github.workspace }}/target/rift-via
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The server runs on its own Java; naming registries needs the data
      # generator of the server's and of each client's version.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - name: Point the harness at each Java runtime
        run: |
          {
            echo "RIFT_JAVA_8=$JAVA_HOME_8_X64/bin/java"
            echo "RIFT_JAVA_17=$JAVA_HOME_17_X64/bin/java"
            echo "RIFT_JAVA_21=$JAVA_HOME_21_X64/bin/java"
            echo "RIFT_JAVA_25=$JAVA_HOME_25_X64/bin/java"
          } >> "$GITHUB_ENV"
      - name: Play translated sessions on a real server through Rift
        env:
          SERVER: ${{ matrix.server }}
          CLIENTS: ${{ matrix.clients }}
        run: >-
          python tests/translation_matrix.py --accept-eula
          --server "$SERVER" --client "$CLIENTS"
          --via rift --binary target/release/rift
      - name: Preserve server, proxy and client logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translation-matrix-${{ matrix.server }}
          path: |
            target/minecraft/runs/*/*.log
            target/minecraft/runs/*/result.json
            target/minecraft/runs/*/rift.lua
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    name: Loopback performance report
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's Linux executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rift-linux-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Extract executable
        run: |
          mkdir -p target/release
          tar -xzf "$RUNNER_TEMP/rift-linux.tar.gz" -C target/release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify pinned official Velocity
        id: velocity
        run: |
          jar="$(python scripts/fetch_velocity.py)"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
      - name: Check equivalent Rift and Velocity workloads
        # A correctness smoke test; shared-runner timings are not release claims.
        env:
          VELOCITY_JAR: ${{ steps.velocity.outputs.jar }}
        run: >-
          python tests/compare_velocity.py --binary target/release/rift
          --velocity-jar "$VELOCITY_JAR"
          --trials 1 --clients 2 --duration 1 --warmup 1
          --attempts 8 --burst-size 2 --require-success
          --report target/velocity-smoke.json --work-dir target/velocity-smoke-artifacts
      - name: Record performance (no timing thresholds on shared runners)
        run: |
          mkdir -p target
          python tests/bench.py --binary target/release/rift --report target/benchmark.json | tee target/benchmark.txt
      - name: Exercise operational pilot and record buffer comparison
        run: python tests/pilot.py --binary target/release/rift --report target/pilot.json
      - name: Add benchmark to run summary
        run: |
          {
            echo '### Loopback benchmark'
            echo 'Informational; compare repeated runs on the same hardware.'
            echo '```text'
            cat target/benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark
          path: |
            target/benchmark.*
            target/pilot.json
            target/velocity-smoke*
          retention-days: 14

  ci-ready:
    name: CI ready
    if: always()
    needs: [quality, plugin-sdk-rust, plugin-sdk-c, plugin-sdk-go, plugin-examples-wasm, audit, regression, test-session-server, java, build-linux, minecraft, compatibility, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          print('All required checks passed.')
          PY
