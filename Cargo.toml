[workspace]
members = [
    ".",
    "crates/rift-permissions",
    "crates/rift-permissions-client",
    "crates/rift-permissions-testing",
    "crates/rift-permissions-ffi",
    "crates/rift-messaging",
    "crates/rift-translation",
]
# Plain `cargo build/test/clippy` in the root covers every crate, as CI expects.
default-members = [
    ".",
    "crates/rift-permissions",
    "crates/rift-permissions-client",
    "crates/rift-permissions-testing",
    "crates/rift-permissions-ffi",
    "crates/rift-messaging",
    "crates/rift-translation",
]
# The Pumpkin plugin pulls in Pumpkin from git; it builds on its own (see
# adapters/pumpkin and docs/permissions-pumpkin.md).
exclude = ["adapters/pumpkin"]
resolver = "3"

[workspace.package]
# Keep in step with the root package version: release tags cover every crate.
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[workspace.dependencies]
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = "0.14"
rift = { path = ".", version = "0.1.0" }
rift-messaging = { path = "crates/rift-messaging", version = "0.1.0" }
rift-permissions = { path = "crates/rift-permissions", version = "0.1.0" }
rift-translation = { path = "crates/rift-translation", version = "0.1.0" }
rift-permissions-client = { path = "crates/rift-permissions-client", version = "0.1.0" }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"

[package]
name = "rift"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored"] }
rift-permissions.workspace = true
rift-translation.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
serde_json.workspace = true
serde = { workspace = true, features = ["rc"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
aes = { version = "0.9", features = ["zeroize"] }
cfb8 = { version = "0.9", features = ["zeroize"] }
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
hmac = "0.13"
sha2 = "0.11"
bytes.workspace = true
quinn.workspace = true
rustls.workspace = true
rift-messaging.workspace = true
# `rift dev` generates its messaging certificate.
rcgen.workspace = true
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["cranelift", "component-model", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "50.0.1", optional = true, default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0.1", optional = true, default-features = false, features = ["default-send-request", "p2"] }

[features]
default = ["wasm"]
# WebAssembly plugins (engine = "wasm") through wasmtime.
wasm = ["dep:http", "dep:http-body-util", "dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http"]
# Tests only: lets RIFT_TEST_SESSION_URL replace Mojang's session server with a
# loopback one (docs/plugins.md). Never part of the default set or a release.
test-session-server = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The end-to-end permission tests run the real backend client.
rift-permissions-client.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
