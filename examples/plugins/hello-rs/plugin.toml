# Build with `cargo build --release --target wasm32-wasip2`, then copy
# target/wasm32-wasip2/release/hello_rs.wasm next to this file.
name = "hello-rs"
version = "0.1.0"
api = "0.1"
mode = "persistent"
engine = "wasm"
entry = "hello_rs.wasm"
hot_reload = false

[failure]
on_timeout = "deny"
on_failure = "deny"
restart = "on-failure"

[capabilities]
filesystem = ["data"]
network = false
