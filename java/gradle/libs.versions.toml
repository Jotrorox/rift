[versions]
kwik = "0.12.2"
junit = "6.1.3"
paper = "1.21.11-R0.1-SNAPSHOT"
mockbukkit = "4.116.3"
vault = "1.7.1"
placeholderapi = "2.12.3"
shadow = "9.6.1"

[libraries]
kwik = { module = "tech.kwik:kwik", version.ref = "kwik" }
